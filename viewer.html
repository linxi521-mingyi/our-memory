<!DOCTYPE html>
<html lang="zh-CN" class="love-viewer-page">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FFF5F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>加载中…</title>
<link rel="stylesheet" href="js/theme.css">
<script src="js/loader.js"></script>
<script src="js/chat-viewer.js"></script>
<script src="js/crypto-app.js"></script>
</head>
<body class="love-viewer-page">
<script>
(function () {
  if (!sessionStorage.getItem('love_aes_key')) {
    location.replace('login.html');
    return;
  }
  var title = sessionStorage.getItem('love_viewer_title') || '加载中';
  var vid = new URLSearchParams(location.search).get('v') || '';
  LoveLoader.show(title);

  LoveCrypto.renderViewerPage(vid).catch(function (err) {
    LoveLoader.fail((err && err.message) ? err.message : '加载失败');
    setTimeout(function () { location.replace('index.html'); }, 1600);
  });
})();
</script>
</body>
</html>
